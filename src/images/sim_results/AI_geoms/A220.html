  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

    }
    window.addEventListener('message', function (e) {

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;

              const { done, value } = await reader.read();

          return;
        }

          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>A220-300 — outer mold line<\u002Ftitle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  },\n  \"integrity\": {\n    \"https://unpkg.com/three@0.184.0/build/three.module.js\": \"sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J\",\n    \"https://unpkg.com/three@0.184.0/build/three.core.js\": \"sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\": \"sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\": \"sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\": \"sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ\"\n  }\n}\n<\u002Fscript>\n<style>\n  html, body { margin: 0; height: 100%; background: #eceef0; }\n  three-d-stage:not(:defined) { visibility: hidden; }\n  #hud { position: fixed; left: 16px; top: 16px; font: 11px/1.55 ui-monospace, Menlo, Consolas, monospace; color: #23272c; background: rgba(255,255,255,.82); border: 1px solid rgba(20,25,30,.14); border-radius: 6px; padding: 10px 12px; }\n  #hud summary { cursor: pointer; }\n  #hud b { font: 600 13px/1.4 Helvetica, Arial, sans-serif; display: block; margin-bottom: 4px; }\n  #hud table { border-collapse: collapse; margin-top: 6px; }\n  #hud td { padding: 0 12px 0 0; white-space: nowrap; }\n  #hud td.r { text-align: right; }\n  #hud .dim { color: #6a727b; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<three-d-stage name=\"a220-300-oml\" background=\"#eceef0\"><\u002Fthree-d-stage>\n<div id=\"hud\"><\u002Fdiv>\n<script src=\"3dc7f530-c735-47bc-913c-a9154c1bb4d8\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\n\n// Aircraft frame while building: x aft from nose (m), y up, z spanwise (+z = right wing\n// seen from above with nose at -x). Fuselage axis is y = 0. Export is recentred to mid-length.\nconst LEN = 38.7, R = 1.75, X0 = LEN / 2, D2R = Math.PI / 180;\nconst V = (x, y, z) => new THREE.Vector3(x, y, z);\nconst mat = (name, color, roughness = 0.6) => new THREE.MeshStandardMaterial({ name, color, roughness, metalness: 0.05 });\nconst MAT = {\n  fuselage: mat('fuselage_skin', 0xf1f2f3, 0.5),\n  lifting: mat('lifting_surface', 0xc4cbd3),\n  nacelle: mat('nacelle_skin', 0x8a96a4, 0.55),\n  fairing: mat('fairing_skin', 0xdde1e5),\n};\nconst model = new THREE.Group(); model.name = 'A220-300_OML';\nconst report = [];\n\n// Monotone cubic interpolation through keypoints\nfunction pchip(xs, ys) {\n  const n = xs.length, h = [], d = [], m = new Array(n);\n  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; d[i] = (ys[i + 1] - ys[i]) / h[i]; }\n  m[0] = d[0]; m[n - 1] = d[n - 2];\n  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / d[i - 1] + (h[i] + 2 * h[i - 1]) / d[i]);\n  return x => {\n    let i = 0; while (i < n - 2 && x > xs[i + 1]) i++;\n    const t = (x - xs[i]) / h[i], t2 = t * t, t3 = t2 * t;\n    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h[i] * m[i + 1];\n  };\n}\nconst cosSpace = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * 0.5 * (1 - Math.cos(Math.PI * i / n)));\n\n// Skin a stack of equal-size point rings into ONE indexed, welded, closed mesh.\n// start/end: 'strip' (airfoil cap), 'fan', {point}; closed:true wraps last ring to first (torus).\nfunction loft(name, material, rings, o = {}) {\n  const M = rings[0].length, pos = [], idx = [];\n  const inset = (a, b) => a.map((p, i) => p.clone().lerp(b[i], 0.004));\n  let rs = rings;\n  if (o.start === 'fan' || o.start === 'strip') rs = [rs[0], inset(rs[0], rs[1]), ...rs.slice(1)];\n  if (o.end === 'fan' || o.end === 'strip') { const L = rs.length; rs = [...rs.slice(0, L - 1), inset(rs[L - 1], rs[L - 2]), rs[L - 1]]; }\n  for (const r of rs) for (const p of r) pos.push(p.x - X0, p.y, p.z);\n  const N = rs.length, nj = o.closed ? N : N - 1;\n  for (let j = 0; j < nj; j++) {\n    const jn = (j + 1) % N;\n    for (let i = 0; i < M; i++) { const a = j * M + i, b = j * M + (i + 1) % M, c = jn * M + i, d = jn * M + (i + 1) % M; idx.push(a, b, d, a, d, c); }\n  }\n  const cap = (type, j, flip) => {\n    if (!type) return;\n    const base = j * M;\n    if (type === 'strip') {\n      const n = M / 2, t = [[0, 1, M - 1]];\n      for (let i = 1; i <= n - 2; i++) t.push([i, i + 1, M - i - 1], [i, M - i - 1, M - i]);\n      t.push([n - 1, n, n + 1]);\n      for (const [a, b, c] of t) flip ? idx.push(base + a, base + c, base + b) : idx.push(base + a, base + b, base + c);\n    } else {\n      const c = type === 'fan' ? rs[j].reduce((s, p) => s.add(p), V(0, 0, 0)).multiplyScalar(1 / M) : type.point;\n      const ci = pos.length / 3; pos.push(c.x - X0, c.y, c.z);\n      for (let i = 0; i < M; i++) { const a = base + i, b = base + (i + 1) % M; flip ? idx.push(ci, b, a) : idx.push(ci, a, b); }\n    }\n  };\n  cap(o.start, 0, true); cap(o.end, N - 1, false);\n  // outward orientation via signed volume\n  let vol = 0;\n  for (let k = 0; k < idx.length; k += 3) {\n    const [a, b, c] = [idx[k] * 3, idx[k + 1] * 3, idx[k + 2] * 3];\n    vol += pos[a] * (pos[b + 1] * pos[c + 2] - pos[b + 2] * pos[c + 1]) - pos[a + 1] * (pos[b] * pos[c + 2] - pos[b + 2] * pos[c]) + pos[a + 2] * (pos[b] * pos[c + 1] - pos[b + 1] * pos[c]);\n  }\n  vol /= 6;\n  if (vol < 0) { for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t; } vol = -vol; }\n  // watertight test: every directed edge used once and matched by its reverse\n  const E = new Map(), key = (a, b) => a * 100000 + b; let ok = true;\n  for (let k = 0; k < idx.length; k += 3) for (let e = 0; e < 3; e++) { const q = key(idx[k + e], idx[k + (e + 1) % 3]); E.set(q, (E.get(q) || 0) + 1); }\n  for (const [q, n] of E) { const a = Math.floor(q / 100000), b = q % 100000; if (n !== 1 || a === b || E.get(key(b, a)) !== 1) { ok = false; break; } }\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\n  g.setIndex(idx); g.computeVertexNormals();\n  const mesh = new THREE.Mesh(g, material); mesh.name = name; model.add(mesh);\n  report.push({ name, tris: idx.length / 3, vol, ok });\n  return mesh;\n}\n\n// Body of super-elliptic sections along x; first and last x are closing poles.\nfunction sectionBody(name, material, xs, f, e, M, zc = 0) {\n  const rings = [];\n  for (let k = 1; k < xs.length - 1; k++) {\n    const { yt, yb, w } = f(xs[k]), yc = (yt + yb) / 2, h = (yt - yb) / 2, ring = [];\n    for (let i = 0; i < M; i++) {\n      const th = 2 * Math.PI * i / M, c = Math.cos(th), s = Math.sin(th);\n      ring.push(V(xs[k], yc + h * Math.sign(c) * Math.abs(c) ** (2 / e), zc + w * Math.sign(s) * Math.abs(s) ** (2 / e)));\n    }\n    rings.push(ring);\n  }\n  const a = f(xs[0]), b = f(xs[xs.length - 1]);\n  return loft(name, material, rings, { start: { point: V(xs[0], (a.yt + a.yb) / 2, zc) }, end: { point: V(xs[xs.length - 1], (b.yt + b.yb) / 2, zc) } });\n}\n\n// Airfoil ring: LE → upper → TE → lower, sharp closed TE, cosine spacing. M = 2·NC points.\nconst NC = 32;\nfunction airfoil(le, chord, tc, camber, ex, nrm) {\n  const up = [], lo = [], p = 0.4;\n  for (let i = 0; i <= NC; i++) {\n    const x = 0.5 * (1 - Math.cos(Math.PI * i / NC));\n    const yt = i === NC ? 0 : 5 * tc * (0.2969 * Math.sqrt(x) - 0.1260 * x - 0.3516 * x * x + 0.2843 * x ** 3 - 0.1036 * x ** 4);\n    const yc = x < p ? camber / (p * p) * (2 * p * x - x * x) : camber / ((1 - p) ** 2) * (1 - 2 * p + 2 * p * x - x * x);\n    const P = y => le.clone().addScaledVector(ex, chord * x).addScaledVector(nrm, chord * y);\n    up.push(P(yc + yt)); if (i > 0 && i < NC) lo.push(P(yc - yt));\n  }\n  return [...up, ...lo.reverse()];\n}\nconst mirrorZ = ring => ring.map(p => V(p.x, p.y, -p.z));\nconst tipToTip = right => [...right.slice(1).reverse().map(mirrorZ), ...right];\nfunction station(le, chord, tc, camber, twistDeg, phi) {\n  const a = twistDeg * D2R, n0 = V(0, Math.cos(phi), -Math.sin(phi));\n  const ex = V(Math.cos(a), 0, 0).addScaledVector(n0, -Math.sin(a));\n  const nrm = V(Math.sin(a), 0, 0).addScaledVector(n0, Math.cos(a));\n  return airfoil(le, chord, tc, camber, ex, nrm);\n}\n\n// ───────── Fuselage ─────────\nconst fN = (t, q) => t >= 1 ? 1 : Math.pow(1 - (1 - t) * (1 - t), q);\nconst ramp = (t, a) => t <= 0 ? 0 : (t < a ? t * t / (2 * a) : t - a / 2) / (1 - a / 2);\nconst NOSE_Y = -0.6, TAIL_T = 1.12, TAIL_B = 0.68;\nfunction fus(x) {\n  let yt = R, yb = -R, w = R;\n  if (x < 6.8) yt = NOSE_Y + (R - NOSE_Y) * fN(x / 6.8, 0.7);\n  if (x < 5.0) yb = NOSE_Y - (R + NOSE_Y) * fN(x / 5.0, 0.6);\n  if (x < 5.6) w = R * fN(x / 5.6, 0.62);\n  if (x > 30) yt = R - (R - TAIL_T) * Math.pow((x - 30) / (LEN - 30), 1.5);\n  if (x > 26) yb = -R + (R + TAIL_B) * ramp((x - 26) / (LEN - 26), 0.3);\n  if (x > 28.2) w = R - (R - 0.2) * ramp((x - 28.2) / (LEN - 28.2), 0.4);\n  return { yt, yb, w };\n}\n{\n  const xs = [0];\n  for (let i = 1; i <= 26; i++) xs.push(6.8 * (i / 26) ** 1.8);\n  for (let i = 1; i <= 12; i++) xs.push(6.8 + (26 - 6.8) * i / 12);\n  for (let i = 1; i <= 32; i++) xs.push(26 + (LEN - 0.01 - 26) * i / 32);\n  xs.push(LEN - 0.001, LEN);\n  sectionBody('fuselage', MAT.fuselage, xs, fus, 2, 64);\n}\n\n// ───────── Wing-body (belly) fairing ─────────\n{\n  const kx = [10.6, 11.6, 13.0, 14.5, 19.5, 21.0, 22.4, 23.4];\n  const bot = pchip(kx, [-1.62, -1.95, -2.12, -2.17, -2.17, -2.10, -1.92, -1.62]);\n  const top = pchip(kx, [-1.62, -1.20, -0.80, -0.55, -0.55, -0.80, -1.20, -1.62]);\n  const wid = pchip(kx, [0, 1.10, 1.70, 1.95, 1.95, 1.70, 1.10, 0]);\n  sectionBody('belly_fairing', MAT.fairing, cosSpace(10.6, 23.4, 44), x => ({ yt: top(x), yb: bot(x), w: wid(x) }), 2.6, 48);\n}\n\n// ───────── Wing (one body, winglet tip to winglet tip) ─────────\nconst W = { x0: 13.2, y0: -1.05, sw: 0.52, dih: 5.5 * D2R, zk: 6.0, zb: 16.2, half: 17.55, r: 0.9, cant: 65 * D2R };\n{\n  const right = [], tanG = Math.tan(W.dih);\n  const chord = z => z < W.zk ? 6.6 - 2.7 * z / W.zk : 3.9 - 2.4 * (z - W.zk) / (W.zb - W.zk);\n  const tcF = z => z < W.zk ? 0.14 - 0.02 * z / W.zk : 0.12 - 0.02 * (z - W.zk) / (W.zb - W.zk);\n  for (const z of [0, 0.9, 1.75, 2.6, 3.5, 4.4, 5.2, 6.0, 7, 8, 9, 10, 11, 12, 13, 14, 15, 15.7, W.zb])\n    right.push(station(V(W.x0 + W.sw * z, W.y0 + tanG * z, z), chord(z), tcF(z), 0.015, 2.5 - 4.5 * z / W.zb, W.dih));\n  // blended winglet: circular arc from dihedral to cant angle, then straight\n  const xb = W.x0 + W.sw * W.zb, yb = W.y0 + tanG * W.zb;\n  const La = W.r * (W.cant - W.dih);\n  const zA = W.zb + W.r * (Math.sin(W.cant) - Math.sin(W.dih)), yA = yb + W.r * (Math.cos(W.dih) - Math.cos(W.cant));\n  const Ls = (W.half - zA) / Math.cos(W.cant), S = La + Ls;\n  const wl = (s, y, z, phi) => { const u = s / S; right.push(station(V(xb + s * (W.sw + 0.3 * u), y, z), 1.5 - 0.95 * u, 0.10 - 0.01 * u, 0.015 * (1 - u), -2, phi)); };\n  for (let k = 1; k <= 8; k++) { const phi = W.dih + (W.cant - W.dih) * k / 8; wl(W.r * (phi - W.dih), yb + W.r * (Math.cos(W.dih) - Math.cos(phi)), W.zb + W.r * (Math.sin(phi) - Math.sin(W.dih)), phi); }\n  for (let k = 1; k <= 5; k++) { const l = Ls * k / 5; wl(La + l, yA + l * Math.sin(W.cant), zA + l * Math.cos(W.cant), W.cant); }\n  loft('wing', MAT.lifting, tipToTip(right), { start: 'strip', end: 'strip' });\n\n  // Flap track fairings: canoe bodies under the aft lower surface, running past the trailing edge.\n  const cosG = Math.cos(W.dih);\n  const flapFairing = (name, z, side) => {\n    const c = chord(z), tc = tcF(z), a = (2.5 - 4.5 * z / W.zb) * D2R, xle = W.x0 + W.sw * z, yle = W.y0 + tanG * z, xte = xle + c;\n    const ytF = x => 5 * tc * (0.2969 * Math.sqrt(x) - 0.1260 * x - 0.3516 * x * x + 0.2843 * x ** 3 - 0.1036 * x ** 4);\n    const ycF = x => x < 0.4 ? 0.015 / 0.16 * (0.8 * x - x * x) : 0.015 / 0.36 * (0.2 + 0.8 * x - x * x);\n    const mid = xc => yle + c * (-Math.sin(a) * xc + Math.cos(a) * cosG * ycF(xc));\n    const low = xc => mid(xc) - c * Math.cos(a) * cosG * ytF(xc);\n    const xs = xte - Math.min(0.48 * c, 1.9), xe = xte + Math.min(0.22 * c, 0.8), uTE = (xte - xs) / (xe - xs);\n    const k = Math.min(1.1, Math.max(0.6, c / 3.6)), yTE = mid(1), xc0 = (xs - xle) / c;\n    const depth = pchip([0, 0.12, 0.4, 0.7, 1], [-(mid(xc0) - low(xc0)) / 2, 0.10 * k, 0.30 * k, 0.27 * k, 0.12 * k]);\n    const wid = pchip([0, 0.15, 0.45, 0.8, 1], [0, 0.13 * k, 0.17 * k, 0.13 * k, 0]);\n    const f = x => {\n      const u = (x - xs) / (xe - xs), xc = Math.min(1, (x - xle) / c);\n      if (u <= uTE) return { yt: (mid(xc) + low(xc)) / 2, yb: low(xc) - depth(u), w: wid(u) };\n      const s = (u - uTE) / (1 - uTE);\n      return { yt: yTE - 0.12 * k * s * s, yb: yTE - depth(u), w: wid(u) };\n    };\n    sectionBody(name, MAT.fairing, cosSpace(xs, xe, 30), f, 2.4, 24, side * z);\n  };\n  [3.4, 8.2, 12.2].forEach((z, i) => { flapFairing(`flap_track_fairing_right_${i + 1}`, z, 1); flapFairing(`flap_track_fairing_left_${i + 1}`, z, -1); });\n}\n\n// ───────── Horizontal stabiliser (one body, tip to tip) ─────────\n{\n  const right = [], dih = 5 * D2R;\n  for (const z of [0, 1, 2, 3, 4, 5, 6]) right.push(station(V(32.3 + 0.6 * z, 0.6 + Math.tan(dih) * z, z), 3.5 - 2.2 * z / 6, 0.10 - 0.01 * z / 6, 0, 0, dih));\n  loft('horizontal_stabilizer', MAT.lifting, tipToTip(right), { start: 'strip', end: 'strip' });\n}\n\n// ───────── Vertical stabiliser ─────────\n{\n  const rings = [], y0 = 0.6, y1 = 7.55;\n  for (let k = 0; k <= 8; k++) {\n    const y = y0 + (y1 - y0) * k / 8, le = 29.29 + 0.88 * (y - y0), te = 36.04 + 0.224 * (y - y0);\n    rings.push(airfoil(V(le, y, 0), te - le, 0.10 - 0.01 * k / 8, 0, V(1, 0, 0), V(0, 0, 1)));\n  }\n  loft('vertical_stabilizer', MAT.lifting, rings, { start: 'strip', end: 'strip' });\n}\n\n// ───────── Nacelles (hollow through-duct, torus topology) + pylons ─────────\nconst NAC = { L: 3.7, xi: 12.3, y: -2.05, z: 5.2 };\nconst rOut = t => 1 + 0.561 * Math.sqrt(t) + 0.149 * t - 0.890 * t * t;      // highlight 1.00 → max 1.275 → exit 0.82\nconst rIn = t => 1 - 0.7478 * Math.sqrt(t) + 1.466 * t - 0.898 * t * t;      // throat 0.90 → duct 0.98 → exit 0.82\nfunction nacelle(name, zc) {\n  const n = 28, NT = 72, prof = [], sp = i => { const u = i / n; return u * u * (3 - 2 * u); };\n  for (let i = 0; i <= n; i++) prof.push([sp(i), rOut(sp(i))]);\n  for (let i = n - 1; i >= 1; i--) prof.push([sp(i), rIn(sp(i))]);\n  const rings = [];\n  for (let k = 0; k < NT; k++) { const th = 2 * Math.PI * k / NT, c = Math.cos(th), s = Math.sin(th); rings.push(prof.map(([t, r]) => V(NAC.xi + t * NAC.L, NAC.y + r * c, zc + r * s))); }\n  loft(name, MAT.nacelle, rings, { closed: true });\n}\nfunction pylon(name, zc) {\n  const xe = NAC.xi + NAC.L, shell = x => { const t = (x - NAC.xi) / NAC.L; return NAC.y + 0.65 * rOut(t) + 0.35 * rIn(t); };\n  const aft = pchip([xe, 17.0, 18.0, 18.9], [shell(xe), -1.02, -0.84, -0.60]);\n  const bot = x => x <= xe ? shell(x) : aft(x);\n  const top = pchip([12.85, 13.2, 13.9, 15.0, 15.9, 16.6, 17.8, 18.9], [bot(12.85), -0.80, -0.68, -0.59, -0.55, -0.50, -0.48, -0.60]);\n  const wid = pchip([12.85, 13.3, 14.2, 17.0, 18.2, 18.9], [0, 0.14, 0.20, 0.20, 0.12, 0]);\n  sectionBody(name, MAT.fairing, cosSpace(12.85, 18.9, 40), x => ({ yt: top(x), yb: bot(x), w: wid(x) }), 2.6, 28, zc);\n}\nnacelle('nacelle_right', NAC.z); nacelle('nacelle_left', -NAC.z);\npylon('pylon_right', NAC.z); pylon('pylon_left', -NAC.z);\n\nstage.setObject(model);\n// default view: front three-quarter, a little closer than the bounding-sphere framing\nif (stage._camera && stage._controls) {\n  const c = stage._camera, t = stage._controls.target;\n  c.position.sub(t); c.position.x *= -1; c.position.multiplyScalar(0.58); c.position.add(t);\n  stage._controls.update();\n}\n\n// HUD: overall dimensions + per-body watertightness\nconst box = new THREE.Box3().setFromObject(model), sz = box.getSize(new THREE.Vector3());\ndocument.getElementById('hud').innerHTML =\n  `<b>A220-300 · outer mold line<\u002Fb>` +\n  `L ${sz.x.toFixed(2)} · span ${sz.z.toFixed(2)} · H ${sz.y.toFixed(2)} m (no gear)<br>` +\n  `<details><summary>${report.length} bodies · ${report.every(r => r.ok) ? 'all watertight ✓' : 'OPEN BODY ✗'}<\u002Fsummary>` +\n  `<span class=\"dim\">x aft · y up · z span · metres<br>origin: mid-length, fuselage axis<\u002Fspan>` +\n  `<table>${report.map(r => `<tr><td>${r.name}<\u002Ftd><td class=\"r\">${r.tris} tris<\u002Ftd><td class=\"r\">${r.vol.toFixed(1)} m³<\u002Ftd><td>${r.ok ? '✓ watertight' : '✗ OPEN'}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftable><\u002Fdetails>`;\nwindow.__report = report;\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
